name = "next-tools"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Assets / Static files
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Environment variables for Cloudflare Workers
[vars]
NEXTAUTH_URL = "https://next-tools.workers.dev"

# KV Namespaces / D1 Databases (Optional for caching or serverless persistence)
# [[d1_databases]]
# binding = "DB"
# database_name = "next-tools-db"
# database_id = "your-d1-database-id"
